[package]
name = "evmfuzz"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "A Shanghai-level EVM interpreter and a coverage-guided stateful invariant fuzzer with sequence shrinking"
readme = "README.md"
publish = false

[lib]
name = "evmfuzz"
path = "src/lib.rs"

[[bin]]
name = "evmfuzz"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.89"
clap = { version = "4.5.20", features = ["derive"] }
env_logger = { version = "0.11.5", default-features = false, features = ["auto-color", "humantime"] }
log = "0.4.22"
ripemd = "0.1.3"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
thiserror = "1.0.69"
toml = { version = "0.8.19", default-features = false, features = ["parse"] }

[dev-dependencies]
num-bigint = "0.4.6"
proptest = { version = "1.5.0", default-features = false, features = ["std"] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
